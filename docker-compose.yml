version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: pitambara-dms-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pitambara-dms-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://database:27017/pitambara_dms
      - JWT_SECRET=pitambara_doodh_dairy_secret_token_key_2026
      - NODE_ENV=production
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: - # Note: Standard React static serve or development server. For simple compose preview, we build static files.
    # To run simple dev compose:
    image: node:20-alpine
    container_name: pitambara-dms-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
